# Published measurements that are NOT evaluated (Ruling R28), kept with their source so the report says why.
# StorageReview DGX Spark review (docs/research/dgx-spark-mac-mini.md, "StorageReview 測試條件查證"): the article labels
# the benchmark "vLLM Online Serving" (engine vLLM; no vLLM version or launch flags given), output tok/s at concurrency 1.
# It states no input/output lengths for the per-model results (only for its separate prefill-heavy / decode-heavy test,
# model unnamed), so the calculator cannot be run under the same conditions.
skipped:
  - id: storagereview-spark-llama8b-fp8-c1
    role: fit
    platform: dgx-spark
    # The article names no exact repo (base or Instruct), so the publisher is given instead (final-review I4).
    modelName: Llama 3.1 8B (the article does not say base or Instruct)
    modelOrigin: { developer: Meta, country: US }
    quant: fp8
    concurrency: 1
    metric: decodeTokPerSec
    measured: { value: 23.2, unit: tok/s, status: measured, source: storagereview-dgx-spark, verified: 2026-10-19 }
    reason: 'Llama 3.1 8B 是 gated 模型，未匯入模型目錄；文章也未載明輸入／輸出長度。另外 spark-default.etaBw 0.68 就是由這個點推得，即使納入也是循環驗證'
  - id: storagereview-spark-llama8b-bf16-c1
    role: validate
    platform: dgx-spark
    # The article names no exact repo (base or Instruct), so the publisher is given instead (final-review I4).
    modelName: Llama 3.1 8B (the article does not say base or Instruct)
    modelOrigin: { developer: Meta, country: US }
    quant: bf16
    concurrency: 1
    metric: decodeTokPerSec
    measured: { value: 13.6, unit: tok/s, status: measured, source: storagereview-dgx-spark, verified: 2026-10-19 }
    reason: 'Llama 3.1 8B 是 gated 模型，未匯入模型目錄；文章也未載明輸入／輸出長度'
