      bf16Kv: { value: 16, status: derived, formula: 'GB10（compute capability 12.x）的 MLA backend 優先序第一為 TRITON_MLA（接受 16-bit KV），kernel block 為 MultipleOf(16)，接受預設 16 → 16', inputs: [vllm-v032-mla-backends, vllm-v032-cuda-backend-priority, vllm-v032-block-size-backend], verified: 2026-10-20 }

