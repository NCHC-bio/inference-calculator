- id: nano4-gb200
  name: GB200
  sub: nano4
  group: nchc
  unit: gpu
  hardware: gb200
  # Not stated directly by NCHC: 72 GPU per NVL72 rack / 18 compute nodes per rack.
  gpusPerNode: { value: 4, unit: GPU, status: derived, formula: '72 GPU / 18 node per rack', inputs: [nchc-nano4-manual], verified: 2026-10-19 }
  nodes: { value: 36, unit: node, status: official, source: nchc-nano4-manual, verified: 2026-10-19 }
  tpOptions: [1, 2, 4]
  calibration: nvidia-default
  # Platform-level override of the calibration profile: GB200 4-GPU small-message NCCL ring AllReduce.
  # Ruling R23 (spec §5.4): valid only at p = 4 GPUs, the count it was measured at. TP=2 slightly overestimates;
  # if TP=8 or cross-node is enabled later, add a separate value measured at that GPU count.
  allreduceLatencyUs: { value: 11.0, unit: µs, status: measured, source: arxiv-2607.16100, verified: 2026-10-19 }
  vllmDefaults:
    maxNumSeqs: { value: 1024, status: derived, formula: 'vLLM v0.32.0 API server 預設：GB200 每 GPU 186 GB ≈ 173 GiB，≥ 160 GiB → max_num_seqs 1024', inputs: [vllm-v032-arg-utils, nvidia-gb200-nvl72], verified: 2026-10-20 }
    maxNumBatchedTokens: { value: 16384, status: derived, formula: 'vLLM v0.32.0 API server 預設：GB200 每 GPU 186 GB ≈ 173 GiB，≥ 160 GiB → max_num_batched_tokens 16384', inputs: [vllm-v032-arg-utils, nvidia-gb200-nvl72], verified: 2026-10-20 }
    maxConcurrentBatches: { value: 2, status: derived, formula: 'vLLM v0.32.0 預設開啟 async scheduling（沒有 pooling、不相容的 speculative decoding 或 PP > 1 時），PP = 1 → max_concurrent_batches = 2，max_in_flight_tokens = 2 × max_num_batched_tokens', inputs: [vllm-v032-vllm-config], verified: 2026-10-20 }
    kvBlockSize: { value: 16, status: derived, formula: 'vLLM v0.32.0 CacheConfig.DEFAULT_BLOCK_SIZE = 16；未指定 --block-size 時取「所有 attention backend 都接受的最小 block」，Blackwell（SM100）的預設 backend（FLASHINFER（16／32／64））接受 16 的倍數，所以維持 16', inputs: [vllm-v032-block-size, vllm-v032-block-size-backend, vllm-v032-cuda-backend-priority], verified: 2026-10-20 }
    mlaKvBlockSize:
      fp8Kv: { value: 32, status: derived, formula: 'Blackwell（SM100）MLA backend 優先序第一為 FLASHINFER_MLA（接受 fp8 KV；要求 qk_nope_head_dim ∈ {64, 128, 192}），kernel block 為 32 或 64，不接受 16 → 取最小 32', inputs: [vllm-v032-mla-backends, vllm-v032-cuda-backend-priority, vllm-v032-block-size-backend], verified: 2026-10-20 }
      bf16Kv: { value: 32, status: derived, formula: 'Blackwell（SM100）MLA backend 優先序第一為 FLASHINFER_MLA（接受 16-bit KV；要求 qk_nope_head_dim ∈ {64, 128, 192}），kernel block 為 32 或 64，不接受 16 → 取最小 32', inputs: [vllm-v032-mla-backends, vllm-v032-cuda-backend-priority, vllm-v032-block-size-backend], verified: 2026-10-20 }
      # final-review M26: FLASHINFER_MLA refuses other qk_nope_head_dim values (flashinfer_mla.py L228-L250); vLLM then
      # tries TOKENSPEED_MLA (DeepSeek R1 dims only, so it refuses them too) and CUTLASS_MLA (block 128) (cuda.py L120-L131).
      qkNopeHeadDims: [64, 128, 192]
      otherwise:
        fp8Kv: { value: 128, status: derived, formula: 'qk_nope_head_dim 不在 {64, 128, 192} 時 FLASHINFER_MLA 不接受；SM100 優先序下一個 TOKENSPEED_MLA 只接受 DeepSeek R1 維度（qk_nope 128、qk_rope 64、v 128，而 128 在集合內，所以不會走到這裡）且只支援 fp8 KV；再下一個 CUTLASS_MLA（SM100，接受 fp8／16-bit KV）kernel block 只有 128 → 128', inputs: [vllm-v032-cutlass-mla, vllm-v032-cuda-backend-priority, vllm-v032-mla-backends], verified: 2026-10-21 }
        bf16Kv: { value: 128, status: derived, formula: 'qk_nope_head_dim 不在 {64, 128, 192} 時 FLASHINFER_MLA 不接受；TOKENSPEED_MLA 只支援 fp8 KV 與 DeepSeek R1 維度；CUTLASS_MLA（SM100，接受 16-bit KV）kernel block 只有 128 → 128', inputs: [vllm-v032-cutlass-mla, vllm-v032-cuda-backend-priority, vllm-v032-mla-backends], verified: 2026-10-21 }

