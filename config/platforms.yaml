    maxConcurrentBatches: { value: 2, status: derived, formula: 'vLLM v0.32.0 預設開啟 async scheduling（沒有 pooling、不相容的 speculative decoding 或 PP > 1 時），PP = 1 → max_concurrent_batches = 2，max_in_flight_tokens = 2 × max_num_batched_tokens', inputs: [vllm-v032-vllm-config], verified: 2026-10-20 }
