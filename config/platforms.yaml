# Deployable platforms. ORDER MATTERS: a later tie-break uses file order, and the loader preserves it.
# NCHC platforms are allocated per GPU (unit gpu); self-hosted machines per machine (unit machine, tp 1 only).
# Multi-node / multi-machine sharding is out of scope for this plan.
# vllmDefaults are vLLM v0.32.0 defaults, not NCHC's deployment settings; maxConcurrentBatches 2 assumes async scheduling
# with PP = 1, which the verify command pins with --async-scheduling. Confirming NCHC's settings is GitHub issue #13.

- id: nano4-h200
  name: H200
  sub: nano4
  group: nchc
  unit: gpu
  hardware: h200-sxm
  gpusPerNode: { value: 8, unit: GPU, status: official, source: nchc-nano4-iservice, verified: 2026-10-19 }
  nodes: { value: 220, unit: node, status: official, source: nchc-nano4-iservice, verified: 2026-10-19 }
  tpOptions: [1, 2, 4, 8]
  calibration: nvidia-default
  vllmDefaults:
    maxNumSeqs: { value: 1024, status: derived, formula: 'vLLM v0.32.0 API server 預設：H200 141 GB ≈ 131 GiB，≥ 70 GiB、< 160 GiB 且非 A100 → max_num_seqs 1024', inputs: [vllm-v032-arg-utils, nvidia-h200], verified: 2026-10-20 }
    maxNumBatchedTokens: { value: 8192, status: derived, formula: 'vLLM v0.32.0 API server 預設：H200 141 GB ≈ 131 GiB，≥ 70 GiB、< 160 GiB 且非 A100 → max_num_batched_tokens 8192', inputs: [vllm-v032-arg-utils, nvidia-h200], verified: 2026-10-20 }
    maxConcurrentBatches: { value: 2, status: derived, formula: 'vLLM v0.32.0 預設開啟 async scheduling（沒有 pooling、不相容的 speculative decoding 或 PP > 1 時），PP = 1 → max_concurrent_batches = 2，max_in_flight_tokens = 2 × max_num_batched_tokens', inputs: [vllm-v032-vllm-config], verified: 2026-10-20 }
    kvBlockSize: { value: 16, status: derived, formula: 'vLLM v0.32.0 CacheConfig.DEFAULT_BLOCK_SIZE = 16；未指定 --block-size 時取「所有 attention backend 都接受的最小 block」，Hopper（SM90）的預設 backend（FLASH_ATTN（FA3，MultipleOf(16)））接受 16 的倍數，所以維持 16', inputs: [vllm-v032-block-size, vllm-v032-block-size-backend, vllm-v032-cuda-backend-priority], verified: 2026-10-20 }
    mlaKvBlockSize:
      fp8Kv: { value: 64, status: derived, formula: 'Hopper（SM90）MLA backend 優先序 FLASH_ATTN_MLA → FLASHMLA → …；FLASH_ATTN_MLA 的 KV dtype 只有 auto／float16／bfloat16，FP8 KV 時落到 FLASHMLA（Hopper dense，接受 fp8），其 kernel block 只有 64，不接受 16 → 64', inputs: [vllm-v032-mla-backends, vllm-v032-cuda-backend-priority, vllm-v032-block-size-backend], verified: 2026-10-20 }
      bf16Kv: { value: 16, status: derived, formula: 'Hopper（SM90）MLA backend 優先序第一的 FLASH_ATTN_MLA 接受 16-bit KV，kernel block 為 MultipleOf(16)，接受預設 16 → 16', inputs: [vllm-v032-mla-backends, vllm-v032-cuda-backend-priority, vllm-v032-block-size-backend], verified: 2026-10-20 }

