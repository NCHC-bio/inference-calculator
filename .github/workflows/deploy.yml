name: Deploy website

# Publishes the static site (packages/web/dist) to GitHub Pages on every push to main.
# One-time repo setup by an admin: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm version comes from the packageManager pin in package.json.
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Same gates as CI: never publish a site whose data or tests fail.
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the data bundle and accuracy report first, then the static site (base './').
      - run: pnpm web:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
